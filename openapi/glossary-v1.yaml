openapi: 3.1.0
info:
  title: EduKSX-Glossary API
  version: 1.0.0-entwurf
  summary: Öffentliche Lese-API des Glossary (docs/KONZEPT-API.md)
  description: |
    Liefert nur veröffentlichte Daten. Die Endpunkte für Begriffe, Kategorien, Quellen, Datenstand,
    Änderungen und Export kommen mit dem Datenmodell (Etappe 0.2/0.3) dazu.
  license:
    name: offen (wird festgelegt)
servers:
  - url: https://glossary.eduksx.ch/api
paths:
  /v1:
    get:
      summary: Einstieg und Version
      operationId: getStatus
      responses:
        '200':
          description: Version der API und der Anwendung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '429':
          description: Zu viele Abrufe (Rate-Limit)
components:
  schemas:
    Status:
      type: object
      required: [name, api_version, app_version, endpoints]
      properties:
        name:
          type: string
          examples: [EduKSX-Glossary API]
        api_version:
          type: string
          examples: [v1]
        app_version:
          type: string
          examples: [0.1.0]
        developer_release:
          type: [object, 'null']
          properties:
            commits: { type: integer }
            base: { type: string }
            planned: { type: string }
        openapi:
          type: string
          format: uri
        endpoints:
          type: array
          items: { type: string }
