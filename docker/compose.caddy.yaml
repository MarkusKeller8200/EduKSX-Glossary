# Zusatz zu compose.yaml: hinter Caddy im Netzwerk «proxy» (prod-01, MarKusSX-Operation, #195). Kein Port auf dem
# Host. Im Caddyfile: glossary.eduksx.ch { reverse_proxy ${GLOSSARY_ALIAS}:80 } – je Instanz ein eigener Name,
# z. B. GLOSSARY_ALIAS=glossary (prod) und glossary-test (test).
#   COMPOSE_FILE=compose.yaml:compose.caddy.yaml  (in .env)
services:
    app:
        ports: !reset []
        networks:
            default:
            proxy:
                aliases:
                    - ${GLOSSARY_ALIAS:-glossary}

networks:
    proxy:
        external: true
