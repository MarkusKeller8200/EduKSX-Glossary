# Produktion auf dem Hostinger-VPS (Traefik läuft bereits als eigenes Projekt «traefik», wie für das Intranet).
# Aufbau gleich wie sek-intranet docker/compose.prod.yaml, damit Traefik den Container gleich findet.
# Liegt auf dem Server als /docker/glossary/docker-compose.yml, der Quellcode in ./src.
# Wird bei jedem Deployment von GitHub Actions überschrieben – Einstellungen in ./.env ändern.

name: glossary

# Log-Rotation (#60, docs/LOESCHKONZEPT.md): je Dienst höchstens 3 Dateien à 10 MB. Die Rotation geht nach Grösse;
# die Frist von 14 Tagen gilt als Obergrenze nur zusammen mit der Einstellung des Hosts (DEPLOY.md, Abschnitt Logs).
x-logging: &logging
    driver: json-file
    options:
        max-size: 10m
        max-file: '3'

services:
    app:
        logging: *logging
        build:
            context: ./src
        image: eduksx-glossary:latest
        restart: unless-stopped
        env_file:
            - path: ./.env
              required: false
        environment:
            APP_URL: https://${GLOSSARY_HOST:-glossary.eduksx.ch}
            APP_NAME: EduKSX-Glossary
            # Sitzungs-Cookie nur über HTTPS (#37)
            SESSION_SECURE_COOKIE: 'true'
            # Mails über die Warteschlange mit Wiederholung (#40); abgearbeitet vom Dienst «worker»
            QUEUE_CONNECTION: database
        volumes:
            - glossary-storage:/var/www/html/storage
        labels:
            - traefik.enable=true
            - traefik.http.routers.glossary.rule=Host(`${GLOSSARY_HOST:-glossary.eduksx.ch}`)
            - traefik.http.routers.glossary.entrypoints=websecure
            - traefik.http.routers.glossary.tls.certresolver=letsencrypt
            - traefik.http.services.glossary.loadbalancer.server.port=80

    # Warteschlange (Mails mit Wiederholung, #40); gleiches Image, ohne Migration (GLOSSARY_ROLE)
    worker:
        logging: *logging
        build:
            context: ./src
        image: eduksx-glossary:latest
        restart: unless-stopped
        user: www-data
        depends_on:
            - app
        env_file:
            - path: ./.env
              required: false
        environment:
            APP_URL: https://${GLOSSARY_HOST:-glossary.eduksx.ch}
            APP_NAME: EduKSX-Glossary
            QUEUE_CONNECTION: database
            GLOSSARY_ROLE: worker
        command: php artisan queue:work --tries=3 --backoff=60 --max-time=3600
        volumes:
            - glossary-storage:/var/www/html/storage
        healthcheck:
            disable: true

    # Geplante Aufgaben (z. B. Löschfristen, #41/#42)
    scheduler:
        logging: *logging
        build:
            context: ./src
        image: eduksx-glossary:latest
        restart: unless-stopped
        user: www-data
        depends_on:
            - app
        env_file:
            - path: ./.env
              required: false
        environment:
            APP_URL: https://${GLOSSARY_HOST:-glossary.eduksx.ch}
            APP_NAME: EduKSX-Glossary
            QUEUE_CONNECTION: database
            GLOSSARY_ROLE: scheduler
        command: php artisan schedule:work
        volumes:
            - glossary-storage:/var/www/html/storage
        healthcheck:
            disable: true

volumes:
    glossary-storage:
