name: deploy

# Ausrollen auf den Entwicklungsserver dev (Hostinger, glossary.markussx.ch; docs/KONZEPT-DEPLOYMENT.md, DEPLOY.md).
# Seit #195 wird nichts mehr auf dem Server gebaut: Der Workflow «image» ruft diesen Workflow nach jedem Image auf
# (Tag main-<commit>); von Hand mit Run workflow und frei wählbarem Tag (z. B. main oder 0.10.0).
# Auf dem Server führt der Schlüssel nur /usr/local/bin/glossary-deploy aus (erzwungener Befehl, docker/server).
# Läuft erst, wenn die Repository-Variable DEPLOY_ENABLED=true gesetzt ist.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image-Tag, z. B. main, main-<commit> oder 0.10.0'
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-glossary
      cancel-in-progress: false
    environment:
      name: dev # Hostinger-Entwicklungsserver (#209); test/prod laufen über MarKusSX-Operation
      url: https://${{ vars.GLOSSARY_HOST || 'glossary.markussx.ch' }}
    env:
      HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
      GLOSSARY_HOST: ${{ vars.GLOSSARY_HOST || 'glossary.markussx.ch' }}
      IMAGE: ghcr.io/markuskeller8200/eduksx-glossary:${{ inputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: SSH vorbereiten
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$HOST" || { echo "Variable VPS_HOST fehlt"; exit 1; }
          test -n "$SSH_KEY" || { echo "Secret VPS_SSH_KEY fehlt"; exit 1; }
          install -m 700 -d ~/.ssh
          # Zeilenenden von Windows und Leerzeichen am Zeilenende entfernen (Kopieren aus dem Browser-Terminal, #209)
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error title=VPS_SSH_KEY unlesbar::Secret neu kopieren: ganzer Inhalt inkl. BEGIN- und END-Zeile"; exit 1; }
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' "$HOST" "$VPS_USER" > ~/.ssh/config

      - name: compose-Dateien übertragen
        run: tar -C docker -cf - compose.yaml compose.traefik.yaml compose.caddy.yaml | ssh vps "glossary-deploy dateien"

      # Holt das Image, startet, prüft /up auf dem Server; schlägt die Prüfung fehl, läuft wieder das vorherige Image.
      - name: Ausrollen
        run: |
          if ! ssh vps "glossary-deploy ausrollen $IMAGE $GLOSSARY_HOST" > deploy.txt 2>&1; then
            cat deploy.txt
            .github/scripts/report-failure.sh deploy.txt 'Ausrollen fehlgeschlagen'
            exit 1
          fi
          cat deploy.txt
          echo "### dev: \`$IMAGE\` → https://$GLOSSARY_HOST" >> "$GITHUB_STEP_SUMMARY"
