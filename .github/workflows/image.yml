name: image

# Fertiges Docker-Image in der GitHub Container Registry (#175, docs/KONZEPT-DEPLOYMENT.md D1/D2, KONZEPT-UPDATES.md U1/U2).
# Jeder geprüfte Stand auf main → ghcr.io/<owner>/eduksx-glossary:main und :main-<sha> → dev (Hostinger).
# Beta-Commit (VERSION auf X.Y.Z-beta.N geändert) → zusätzlich :X.Y.Z-beta.N und :beta → test (test-01, sofort).
# Release-Commit (VERSION auf X.Y.Z geändert) → zusätzlich :X.Y.Z, :X.Y, :latest, :stable und :beta
# → prod (prod-01, Wartungsfenster) und test; test liegt so nie hinter prod (#304, DEC-035).
# Nur amd64 (12.11.2026): arm64 per Emulation verlängerte ein Release von 4 auf 18 Minuten und wird heute nicht
# gebraucht. Bei Bedarf: platforms im Schritt «Tags bestimmen» auf "linux/amd64,linux/arm64" und QEMU wieder einschalten.
# Signiert mit cosign (ohne Schlüssel, über GitHub OIDC) und mit Herkunftsnachweis (attest-build-provenance).
# Danach geht das Image auf dev (Workflow «deploy», #195); ein Release entsteht erst, wenn dieser Workflow grün ist.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - 'CHANGELOG.md'
      # Datenschutzerklärung wird auf /datenschutz angezeigt
      - 'docs/DATENSCHUTZ-ENTWURF.md'
      - '!site/**'
      - '!.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: main-${{ steps.meta.outputs.sha }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Tags für «Developer Release» (git describe)

      - name: Tags bestimmen
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eduksx-glossary"
          sha="${GITHUB_SHA::7}"
          version="$(tr -d '[:space:]' < VERSION)"
          tags="$image:main,$image:main-$sha"
          # Versionsanzeige (#308): Developer = Commits seit dem letzten Release-Tag (Betas zählen nicht als Basis)
          describe="$(git describe --tags --long --match 'v[0-9]*' --exclude 'v*-*' 2>/dev/null || true)"
          platforms="linux/amd64"
          # Release bzw. Beta: Zu VERSION gibt es noch keinen Tag (release.py set X.Y.Z --commit). Schlägt der
          # erste Lauf fehl, übernimmt der nächste grüne Push – wie release.yml, das den Tag erst danach anlegt (#316).
          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            # Tag entsteht erst nach diesem Workflow (release.yml): Stand gilt als genau diese Version
            describe="v$version-0-g$sha"
            case "$version" in
              *-*)
                # Vorabversion (Beta): nur test
                tags="$tags,$image:$version,$image:beta"
                echo "beta=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                minor="${version%.*}"
                tags="$tags,$image:$version,$image:$minor,$image:latest,$image:stable,$image:beta"
                echo "release=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi
          {
            echo "image=$image"
            echo "sha=$sha"
            echo "tags=$tags"
            echo "platforms=$platforms"
            echo "version=$version"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "describe=$describe"
          } >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Anmelden bei ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und hochladen
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ steps.meta.outputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GLOSSARY_BUILD=${{ github.sha }}
            GLOSSARY_BUILD_DATE=${{ steps.meta.outputs.date }}
            GLOSSARY_BUILD_DESCRIBE=${{ steps.meta.outputs.describe }}
          labels: |
            org.opencontainers.image.title=EduKSX-Glossary
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: cosign
        uses: sigstore/cosign-installer@v3

      - name: Signieren
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Herkunftsnachweis
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Zusammenfassung
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image"
            echo
            echo "- Digest: \`$IMAGE@$DIGEST\`"
            echo "- Tags: \`${TAGS//,/\`, \`}\`"
            echo "- Prüfen: \`cosign verify $IMAGE@$DIGEST --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    needs: image
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      tag: ${{ needs.image.outputs.tag }}
