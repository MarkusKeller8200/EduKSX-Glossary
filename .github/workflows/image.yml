name: image

# Fertiges Docker-Image in der GitHub Container Registry (#175, docs/KONZEPT-DEPLOYMENT.md D1/D2, KONZEPT-UPDATES.md U1/U2).
# Jeder geprüfte Stand auf main → ghcr.io/<owner>/eduksx-glossary:main und :main-<sha>.
# Ein Release-Commit (Datei VERSION geändert) → zusätzlich :X.Y.Z, :X.Y und :latest, für amd64 und arm64.
# Signiert mit cosign (ohne Schlüssel, über GitHub OIDC) und mit Herkunftsnachweis (attest-build-provenance).
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - 'CHANGELOG.md'
      # Datenschutzerklärung wird auf /datenschutz angezeigt
      - 'docs/DATENSCHUTZ-ENTWURF.md'
      - '!site/**'
      - '!.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Tags für «Developer Release» (git describe)

      - name: Tags bestimmen
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eduksx-glossary"
          sha="${GITHUB_SHA::7}"
          version="$(tr -d '[:space:]' < VERSION)"
          tags="$image:main,$image:main-$sha"
          platforms="linux/amd64"
          # Release: VERSION wurde mit diesem Commit geändert (release.py set X.Y.Z --commit)
          if git rev-parse -q --verify HEAD^ >/dev/null && ! git diff --quiet HEAD^ HEAD -- VERSION; then
            minor="${version%.*}"
            tags="$tags,$image:$version,$image:$minor,$image:latest"
            platforms="linux/amd64,linux/arm64"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "image=$image"
            echo "tags=$tags"
            echo "platforms=$platforms"
            echo "version=$version"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "describe=$(git describe --tags --long --match 'v[0-9]*' 2>/dev/null || true)"
          } >> "$GITHUB_OUTPUT"

      - name: QEMU (arm64)
        if: steps.meta.outputs.release == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Anmelden bei ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und hochladen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ steps.meta.outputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GLOSSARY_BUILD=${{ github.sha }}
            GLOSSARY_BUILD_DATE=${{ steps.meta.outputs.date }}
            GLOSSARY_BUILD_DESCRIBE=${{ steps.meta.outputs.describe }}
          labels: |
            org.opencontainers.image.title=EduKSX-Glossary
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: cosign
        uses: sigstore/cosign-installer@v3

      - name: Signieren
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Herkunftsnachweis
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Zusammenfassung
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image"
            echo
            echo "- Digest: \`$IMAGE@$DIGEST\`"
            echo "- Tags: \`${TAGS//,/\`, \`}\`"
            echo "- Prüfen: \`cosign verify $IMAGE@$DIGEST --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
