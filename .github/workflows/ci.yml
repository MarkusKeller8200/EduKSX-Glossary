name: ci

# Prüfung für Pull Requests und Pushes auf andere Branches (aus sek-intranet tests.yml übernommen).
# Pushes auf main prüft deploy.yml (ruft diesen Workflow auf). Reine Doku-Änderungen lösen keine Prüfung aus.
on:
  push:
    branches-ignore: [main]
    paths-ignore: ['**/*.md', 'site/**', '.github/dependabot.yml']
  pull_request:
    paths-ignore: ['**/*.md', 'site/**']
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Tags für Version und Release-Prüfung

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Zwischenspeicher Composer und npm
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer
            ~/.npm
          key: deps-${{ runner.os }}-${{ hashFiles('composer.json', 'composer.lock', 'package.json', 'package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Setup Application
        run: composer setup

      - name: Lizenzen der Pakete (#73, nur Warnung)
        run: |
          composer licenses --no-dev --format=json > composer-licenses.json
          npm ls --omit=dev --all --json --long > npm-tree.json || true
          node scripts/license-report.mjs composer-licenses.json npm-tree.json > license-report.md

      - name: Version und CHANGELOG prüfen
        run: python3 .github/blueprint/release.py check

      - name: Postman-Sammlung aktuell (#158)
        run: python3 scripts/postman.py --check

      - name: Script zur Einbindung aktuell (#155)
        run: node scripts/build-embed.mjs --check

      - name: Browser-Erweiterung bauen (#153)
        run: node scripts/build-extension.mjs

      - name: Run CI Checks
        run: |
          set -o pipefail
          composer ci:check 2>&1 | tee ci-output.txt

      - name: Fehler anzeigen
        if: failure()
        run: |
          .github/scripts/report-failure.sh ci-output.txt 'CI-Prüfung fehlgeschlagen'
          if grep -q 'Formatting issues' ci-output.txt; then
            npx vp check --fix > /dev/null 2>&1 || true
            git diff > fmt.diff
            .github/scripts/report-failure.sh fmt.diff 'Formatierung (Korrektur)' 400
          fi

  # Gleiche Tests gegen PostgreSQL (#287, W1): Migrationen, CHECK-Regeln, Fremdschlüssel und Typen auch dort.
  # Reine SQLite-Tests (STRICT, Übergang aus 0.11, Sicherung als Datei) werden übersprungen.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: glossary
          POSTGRES_PASSWORD: glossary
          POSTGRES_DB: glossary_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U glossary" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: glossary_test
      DB_USERNAME: glossary
      DB_PASSWORD: glossary
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Zwischenspeicher Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Abhängigkeiten
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate

      - name: Migrationen auf PostgreSQL
        run: php artisan migrate --force

      - name: Tests auf PostgreSQL
        run: php artisan test
